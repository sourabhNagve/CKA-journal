#  k edit deployement web-app -n production
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "9"
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"labels":{"app":"web-app","tier":"frontend"},"name":"web-app","namespace":"production"},"spec":{"replicas":2,
  creationTimestamp: "2026-06-16T12:43:41Z"
  generation: 9
  labels:
    app: web-app
    tier: frontend
  name: web-app
  namespace: production
  resourceVersion: "9088"
  uid: d0e48e38-7f1f-4e64-8a2d-fdbd9f07fc0f
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: web-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web-app
        tier: frontend
    
    pec:
      containers:
      - args:
        - -c
        - |
          mkdir -p /var/log/app
          echo "Application starting..." > /var/log/app/app.log
          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - [INFO] Processing request $RANDOM" >> /var/log/app/app.log
            sleep 5
          done
        command:
        - /bin/sh
        image: busybox:latest
        imagePullPolicy: Always
        name: application
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/log/app
          name: log-volume
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - touch /var/log/app/app.log && tail -F '/var/log/app/app.log'
        image: fluentd:latest
        imagePullPolicy: Always
        name: log-agent
        resources: {}
        restartPolicy: Always
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/log/app
          name: log-volume
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: log-volume

# here we have added the touch command inside the sidecar container to ensure that the log file is created before the application container starts writing to it. This way, we can avoid any potential issues with the application container trying to write to a non-existent file. The log-agent container will continuously tail the log file, allowing us to see the logs in real-time.
# without this command the side car starts first and there wont be any file present and it will exit with an error and the main container will start and create the file but the side car will not be able to read the logs as it has already exited. By adding the touch command, we ensure that the log file is created before the application container starts writing to it, allowing the side car to read the logs without any issues.